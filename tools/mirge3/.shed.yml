---
name: mirge3
owner: iuc
description: "Comprehensive small RNA-seq analysis pipeline (miRge3.0)"
long_description: |
  miRge3.0 is a comprehensive Python pipeline for small RNA-seq data analysis.
  It performs adapter trimming, read collapsing, alignment to small-RNA annotation
  libraries, known miRNA quantification, isomiR analysis, A-to-I RNA editing
  detection, tRNA fragment (tRF) analysis, novel miRNA prediction, UMI
  processing/deduplication, optional differential expression (DESeq2), and
  produces interactive HTML reports.
categories:
- RNA
- Transcriptomics
